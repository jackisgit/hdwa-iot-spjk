server:
  port: ${CAMERASERVER_SERVER_PORT:9888}
  servlet:
   context-path: /camera  
   
config:
# 直播流保活时间(分钟)
  keepalive: ${CAMERASERVER_KEEPALIVE:1000}
# nginx推送地址
  push_host: ${CAMERASERVER_PUSH_HOST:127.0.0.1}
#  push_host: ${CAMERASERVER_PUSH_HOST:192.168.0.31}
# 额外推送地址
  host_extra: ${CAMERASERVER_HOST_EXTRA:127.0.0.1}
# nginx推送端口
  push_port: ${CAMERASERVER_PUSH_PORT:1935}
# m3u8服务端口
  m3u8_port: ${CAMERASERVER_M3U8_PORT:8085}
# m3u8文件路径
  m3u8_path: ${CAMERASERVER_M3U8_PSTH:D:\\nginx\\nginx-rtmp-win32\\nginx-rtmp-win32-master\\temp\\hls\\}
# hls分段切片间隔(分钟)
  hls_interval: ${CAMERASERVER_HLS_INTERVAL:1}
# 主码流最大码率
  main_code: ${CAMERASERVER_MAIN_CODE:5120}
# 子码流最大码率
  sub_code: ${CAMERASERVER_SUB_CODE:1024} 
# 设备码率上限
  bitrate: ${CAMERASERVER_BITRATE:8192}
# sdk库文件地址
  libpath: ${CAMERASERVER_LIBPATH:D:\vedio\sdk}
# 编译版本信息
  version: '@COMMIT_REV@.@BUILD_DATE@'
  # 下载录像文件到指定目录
  videopath: ${CAMERASERVER_VIDEOPATH:E:\wanda\zlm-win-x86_64\www\live}
  # 抓图到指定目录
  picturepath: ${CAMERASERVER_PICTUREPATH:E:\wanda\zlm-win-x86_64\www\history}
# 删除服务器上的录像文件周期
  deletevideocron: ${CAMERASERVER_DELETEVIDEOCRON:0 0 0 * * ?}
# 删除服务器上的抓图文件周期
  deletepicturecron: ${CAMERASERVER_DELETEPICTURECRON:0 0 0 * * ?}
  
 
# logback
logging: 
  level:
    com.junction: debug
# 将日志输出到文件    
  config: classpath:camera-log.xml

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/huiyun?useUnicode=true&characterEncoding=UTF8&serverTimezone=PRC&useSSL=false&allowMultiQueries=true
    username: root
    password: wanda@1234
    druid:
      initialSize: 10                       # 连接池初始化连接数
      maxActive: 200                        # 连接池最大连接数
      minIdle: 5                            # 连接池最小空闲连接数
      maxWait: 60000                        # 获取连接时最大等待时间，单位毫秒。配置了maxWait之后，缺省启用公平锁，并发效率会有所下降，如果需要可以通过配置useUnfairLock属性为true使用非公平锁。
      keepAlive: true                       # 连接池中的minIdle数量以内的连接，空闲时间超过minEvictableIdleTimeMillis，则会执行keepAlive操作。
      validationQuery: select 1             # 检测连接是否有效sql，要求是查询语句，常用select 'x'。如果validationQuery为null，testOnBorrow、testOnReturn、testWhileIdle都不会起作用。
      testWhileIdle: true                   # 建议配置为true，不影响性能，并且保证安全性。申请连接的时候检测，如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效。
      testOnBorrow: false                   # 申请连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能。
      testOnReturn: false                   # 归还连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能。
      poolPreparedStatements: false         # 是否開啟PSCache，並且指定每個連線上PSCache的大小
      timeBetweenEvictionRunsMillis: 60000  # 配置間隔多久才進行一次檢測，檢測需要關閉的空閒連線，單位是毫秒
      minEvictableIdleTimeMillis: 300000    # 配置一個連線在池中最小生存的時間，單位是毫秒
      filters: stat,wall,slf4j             # 配置监控统计拦截的filters，监控统计用的filter:sta, 日志用的filter:log4j, 防御sql注入的filter:wall
      useGlobalDataSourceStat: true         # 合并多个DruidDataSource的监控数据
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
      #stat-view-servlet.url-pattern: /admin/druid/*
projectIp: 10.40.32.30